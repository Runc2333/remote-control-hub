[package]
name = "agent-service"
version = "0.1.3"
edition = "2024"
license.workspace = true

[dependencies]
agent-core = { version = "0.1.3", path = "../../crates/agent-core" }
agent-ipc-protocol = { version = "0.1.3", path = "../../crates/agent-ipc-protocol" }
agent-wire = { version = "0.1.3", path = "../../crates/agent-wire" }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"
windows-platform = { version = "0.1.3", path = "../../crates/windows-platform" }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
