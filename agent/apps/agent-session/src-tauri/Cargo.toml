[package]
name = "agent-session"
version = "0.1.1"
description = "Remote Control Hub interactive Windows session"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "agent_session_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"
windows-platform = { version = "0.1.1", path = "../../../crates/windows-platform" }
agent-ipc-protocol = { version = "0.1.1", path = "../../../crates/agent-ipc-protocol" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
semver = "1.0.27"
