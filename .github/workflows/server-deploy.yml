name: Server image and deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 40 位 commit SHA；留空使用当前 commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-deploy
    concurrency:
      cancel-in-progress: false
      group: production
    steps:
      - id: commit
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          value="${REQUESTED_COMMIT:-$GITHUB_SHA}"
          [[ "$value" =~ ^[a-f0-9]{40}$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.commit.outputs.value }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build server image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          load: true
          platforms: linux/amd64
          provenance: false
          push: false
          tags: remote-control-hub-server:sha-${{ steps.commit.outputs.value }}
      - id: artifacts
        name: Package image and deployment bundle
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.value }}
        run: |
          set -Eeuo pipefail
          image_reference="remote-control-hub-server:sha-$COMMIT_SHA"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_reference")"
          mkdir -p artifact
          printf '{"commit":"%s","imageId":"%s","imageReference":"%s"}\n' "$COMMIT_SHA" "$image_id" "$image_reference" > deploy/source.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C deploy -czf artifact/deployment-bundle.tar.gz .
          docker image save "$image_reference" | gzip --best > artifact/server-image.tar.gz
          bundle_sha256="$(sha256sum artifact/deployment-bundle.tar.gz | cut -d' ' -f1)"
          image_sha256="$(sha256sum artifact/server-image.tar.gz | cut -d' ' -f1)"
          printf '%s  %s\n' "$bundle_sha256" deployment-bundle.tar.gz > artifact/deployment-bundle.tar.gz.sha256
          printf '%s  %s\n' "$image_sha256" server-image.tar.gz > artifact/server-image.tar.gz.sha256
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          echo "image_reference=$image_reference" >> "$GITHUB_OUTPUT"
          echo "image_sha256=$image_sha256" >> "$GITHUB_OUTPUT"
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          [[ -s ~/.ssh/known_hosts ]]
      - name: Upload image and deployment bundle
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.value }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]
          [[ "$DEPLOY_PATH" != "/" ]]
          [[ ! "$DEPLOY_PATH" =~ (^|/)\.(/|$) ]]
          [[ ! "$DEPLOY_PATH" =~ (^|/)\.\.(/|$) ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/incoming/$COMMIT_SHA' '$DEPLOY_PATH/releases'"
          scp -P "$DEPLOY_PORT" \
            artifact/deployment-bundle.tar.gz \
            artifact/server-image.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/$COMMIT_SHA/"
      - name: Deploy transferred image
        shell: bash
        env:
          APP_URL: ${{ secrets.APP_URL }}
          BUNDLE_SHA256: ${{ steps.artifacts.outputs.bundle_sha256 }}
          COMMIT_SHA: ${{ steps.commit.outputs.value }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REFERENCE: ${{ steps.artifacts.outputs.image_reference }}
          IMAGE_SHA256: ${{ steps.artifacts.outputs.image_sha256 }}
        run: |
          set -Eeuo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$DEPLOY_PATH" "$COMMIT_SHA" "$BUNDLE_SHA256" "$IMAGE_REFERENCE" "$IMAGE_SHA256" "$APP_URL" <<'REMOTE'
          set -Eeuo pipefail
          deploy_root="$1"
          commit_sha="$2"
          bundle_sha256="$3"
          image_reference="$4"
          image_sha256="$5"
          app_url="$6"
          incoming_directory="$deploy_root/incoming/$commit_sha"
          bundle_archive="$incoming_directory/deployment-bundle.tar.gz"
          image_archive="$incoming_directory/server-image.tar.gz"
          release_directory="$deploy_root/releases/$commit_sha"
          [[ "$(sha256sum "$bundle_archive" | cut -d' ' -f1)" == "$bundle_sha256" ]]
          [[ "$(sha256sum "$image_archive" | cut -d' ' -f1)" == "$image_sha256" ]]
          [[ ! -e "$release_directory" ]]
          docker image load --input "$image_archive" >/dev/null
          docker image inspect "$image_reference" >/dev/null
          mkdir -m 0700 "$release_directory"
          tar -xzf "$bundle_archive" -C "$release_directory"
          if ! bash "$release_directory/scripts/deploy.sh" "$deploy_root" "$release_directory" "$image_reference" "$commit_sha" "$bundle_sha256" "$image_sha256" "$app_url"; then
            rm -rf --one-file-system -- "$release_directory"
            exit 1
          fi
          bash "$release_directory/scripts/prune-releases.sh" "$deploy_root" 3
          rm -rf --one-file-system -- "$incoming_directory"
          REMOTE
