name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: .node-version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: linux-quality
          workspaces: agent -> target
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:check
      - run: pnpm build
      - run: pnpm pwa:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses:check
      - run: bash -n deploy/scripts/*.sh

  rust-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb
        with:
          arguments: --all-features
          command: check advisories licenses sources
          manifest-path: agent/Cargo.toml
          rust-version: "1.93.0"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          context: .
          load: true
          push: false
          tags: remote-control-hub-server:ci

  windows-agent:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: .node-version
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: "v0.17.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-targets: false
          shared-key: windows-agent
          workspaces: agent -> target
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet-tools.json') }}
          path: ~/.nuget/packages
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remote-control-hub/agent-session test
      - run: cargo test --manifest-path agent/Cargo.toml --workspace --locked
      - run: cargo build --manifest-path agent/Cargo.toml --workspace --locked --target x86_64-pc-windows-msvc
      - name: Build WiX MSI
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet tool run wix -- extension add -g WixToolset.Util.wixext/7.0.0
          pnpm version:check
          $version = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          cargo build --manifest-path agent/Cargo.toml --workspace --exclude agent-session --exclude agent-bootstrapper --locked --release --target x86_64-pc-windows-msvc
          pnpm --filter @remote-control-hub/agent-session exec tauri build --no-bundle --target x86_64-pc-windows-msvc
          $service = (Resolve-Path -LiteralPath "agent/target/x86_64-pc-windows-msvc/release/agent-service.exe").Path
          $session = (Resolve-Path -LiteralPath "agent/target/x86_64-pc-windows-msvc/release/agent-session.exe").Path
          $icon = (Resolve-Path -LiteralPath "agent/apps/agent-session/src-tauri/icons/icon.ico").Path
          $msi = "agent/target/x86_64-pc-windows-msvc/release/remote-control-hub-agent.msi"
          dotnet tool run wix -- build -acceptEula wix7 "agent/installer/wix/Package.wxs" -arch x64 -ext WixToolset.Util.wixext -d "ProductVersion=$version" -d "AgentServicePath=$service" -d "AgentSessionPath=$session" -d "AgentIconPath=$icon" -out $msi
          dotnet tool run wix -- msi validate -acceptEula wix7 $msi
          $webView2 = "agent/target/x86_64-pc-windows-msvc/release/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $webView2
          $signature = Get-AuthenticodeSignature -LiteralPath $webView2
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "The WebView2 Bootstrapper signature is invalid."
          }
          $env:RCH_EMBEDDED_MSI_PATH = (Resolve-Path -LiteralPath $msi).Path
          $env:RCH_EMBEDDED_WEBVIEW2_PATH = (Resolve-Path -LiteralPath $webView2).Path
          cargo build --manifest-path agent/Cargo.toml --package agent-bootstrapper --locked --release --target x86_64-pc-windows-msvc
          $installer = "agent/target/x86_64-pc-windows-msvc/release/agent-bootstrapper.exe"
          & $installer --verify-bundle
          if ($LASTEXITCODE -ne 0) {
            throw "The self-contained installer payload verification failed."
          }
