name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          node-version-file: .node-version
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:check
      - run: pnpm build
      - run: pnpm pwa:check
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses:check
      - run: bash -n deploy/scripts/*.sh

  rust-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb
        with:
          arguments: --all-features
          command: check advisories licenses sources
          manifest-path: agent/Cargo.toml
          rust-version: "1.93.0"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          load: true
          push: false
          tags: remote-control-hub-server:ci

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remote-control-hub/agent-session test
      - run: pnpm --filter @remote-control-hub/agent-session build
      - run: cargo test --manifest-path agent/Cargo.toml --workspace --locked
      - run: cargo build --manifest-path agent/Cargo.toml --workspace --locked --target x86_64-pc-windows-msvc
      - name: Build WiX MSI
        shell: pwsh
        run: |
          dotnet tool restore
          cargo build --manifest-path agent/Cargo.toml --workspace --locked --release --target x86_64-pc-windows-msvc
          $metadata = cargo metadata --manifest-path agent/Cargo.toml --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "agent-service").version
          $service = (Resolve-Path -LiteralPath "agent/target/x86_64-pc-windows-msvc/release/agent-service.exe").Path
          $session = (Resolve-Path -LiteralPath "agent/target/x86_64-pc-windows-msvc/release/agent-session.exe").Path
          dotnet tool run wix -- build -acceptEula wix7 "agent/installer/wix/Package.wxs" -arch x64 -d "ProductVersion=$version" -d "AgentServicePath=$service" -d "AgentSessionPath=$session" -out "agent/target/x86_64-pc-windows-msvc/release/remote-control-hub-agent.msi"
          dotnet tool run wix -- msi validate -acceptEula wix7 "agent/target/x86_64-pc-windows-msvc/release/remote-control-hub-agent.msi"
