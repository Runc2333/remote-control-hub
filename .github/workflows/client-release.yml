name: Client release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version-file: .node-version
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: "v0.17.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-targets: false
          shared-key: windows-agent
          workspaces: agent -> target
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet-tools.json') }}
          path: ~/.nuget/packages
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Resolve release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          pnpm version:check
          $version = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("v") -or $tag.Substring(1) -ne $version) {
              throw "Tag version must match VERSION."
            }
          }
          $buildTime = (Get-Date).ToUniversalTime().ToString("o")
          "VERSION=$version" >> $env:GITHUB_ENV
          "RCH_BUILD_COMMIT=${{ github.sha }}" >> $env:GITHUB_ENV
          "RCH_BUILD_TIME=$buildTime" >> $env:GITHUB_ENV
          $visibility = gh api "repos/${{ github.repository }}" --jq ".visibility"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to determine repository visibility."
          }
          if ($visibility -eq "public") {
            "RCH_GITHUB_REPOSITORY=${{ github.repository }}" >> $env:GITHUB_ENV
          }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Microsoft WebView2 Evergreen Bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/components" | Out-Null
          $path = "artifacts/components/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $path
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "The WebView2 Bootstrapper signature is invalid."
          }
      - name: Build Windows components
        shell: pwsh
        run: |
          cargo build --manifest-path agent/Cargo.toml --workspace --exclude agent-session --exclude agent-bootstrapper --locked --release --target x86_64-pc-windows-msvc
          pnpm --filter @remote-control-hub/agent-session exec tauri build --no-bundle --target x86_64-pc-windows-msvc
          Copy-Item -LiteralPath "agent/target/x86_64-pc-windows-msvc/release/agent-service.exe" -Destination "artifacts/components/agent-service.exe"
          Copy-Item -LiteralPath "agent/target/x86_64-pc-windows-msvc/release/agent-session.exe" -Destination "artifacts/components/agent-session.exe"
      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet tool run wix -- extension add -g WixToolset.Util.wixext/7.0.0
          $service = (Resolve-Path -LiteralPath "artifacts/components/agent-service.exe").Path
          $session = (Resolve-Path -LiteralPath "artifacts/components/agent-session.exe").Path
          $icon = (Resolve-Path -LiteralPath "agent/apps/agent-session/src-tauri/icons/icon.ico").Path
          dotnet tool run wix -- build -acceptEula wix7 "agent/installer/wix/Package.wxs" -arch x64 -ext WixToolset.Util.wixext -d "ProductVersion=$env:VERSION" -d "AgentServicePath=$service" -d "AgentSessionPath=$session" -d "AgentIconPath=$icon" -out "artifacts/components/remote-control-hub-agent.msi"
          dotnet tool run wix -- msi validate -acceptEula wix7 "artifacts/components/remote-control-hub-agent.msi"
      - name: Build self-contained unsigned installer
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "unsigned-client"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          $env:RCH_EMBEDDED_MSI_PATH = (Resolve-Path -LiteralPath "artifacts/components/remote-control-hub-agent.msi").Path
          $env:RCH_EMBEDDED_WEBVIEW2_PATH = (Resolve-Path -LiteralPath "artifacts/components/MicrosoftEdgeWebview2Setup.exe").Path
          cargo build --manifest-path agent/Cargo.toml --package agent-bootstrapper --locked --release --target x86_64-pc-windows-msvc
          $installer = "$releaseDirectory/Remote-Control-Hub-Agent-Setup-$env:VERSION-unsigned.exe"
          Copy-Item -LiteralPath "agent/target/x86_64-pc-windows-msvc/release/agent-bootstrapper.exe" -Destination $installer
          & $installer --verify-bundle
          if ($LASTEXITCODE -ne 0) {
            throw "The self-contained installer payload verification failed."
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: unsigned-client-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-client/*.exe
          retention-days: 30

  publish-release:
    if: github.ref_type == 'tag'
    needs: build-client
    runs-on: windows-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unsigned-client-${{ github.sha }}
          path: artifacts/unsigned
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/unsigned/*
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem -LiteralPath "artifacts/unsigned" -File | ForEach-Object FullName)
          if ($assets.Count -ne 1) {
            throw "Exactly one release asset is required."
          }
          $asset = Get-Item -LiteralPath $assets[0]
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant()
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          > [!WARNING]
          > This Windows release is not Authenticode signed. Windows may display Unknown publisher or Microsoft Defender SmartScreen warnings. Download it only from this repository and verify the SHA-256 value before installation.

          Commit: ${{ github.sha }}
          File: $($asset.Name)
          SHA-256: ``$sha256``
          Third-party licenses: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/THIRD_PARTY_LICENSES.txt
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM
          $existingRelease = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "$tag (unsigned)" --notes-file $notesPath
            $currentRelease = gh release view $tag --json assets | ConvertFrom-Json
            foreach ($existingAsset in $currentRelease.assets) {
              if ($existingAsset.name -ne $asset.Name) {
                gh release delete-asset $tag $existingAsset.name --yes
                if ($LASTEXITCODE -ne 0) {
                  throw "Unable to remove the previous release asset: $($existingAsset.name)"
                }
              }
            }
          } else {
            gh release create $tag @assets --verify-tag --title "$tag (unsigned)" --notes-file $notesPath
          }
