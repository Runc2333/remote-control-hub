name: remote-control-hub

services:
  remote-control-hub-server:
    container_name: remote-control-hub-server
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    restart: unless-stopped
    depends_on:
      remote-control-hub-mysql:
        condition: service_healthy
      remote-control-hub-redis:
        condition: service_healthy
    environment:
      DEPLOYMENT_MODE: compose
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      COOKIE_SECRET_FILE: /var/lib/remote-control-hub/cookie-secret
      MYSQL_DATABASE: remote_control_hub
      MYSQL_HOST: remote-control-hub-mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_PORT: "3306"
      MYSQL_USER: remote_control_hub
      PORT: "51692"
      REDIS_DATABASE: "0"
      REDIS_HOST: remote-control-hub-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PORT: "6379"
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID is required}
      OPERATIONS_AUDIT_FILE: /var/lib/remote-control-hub/operations-audit.jsonl
      SETUP_CONFIG_FILE: /var/lib/remote-control-hub/setup-config.json
      SETUP_SECRET_FILE: /var/lib/remote-control-hub/setup-secret.json
      SETUP_STATE_FILE: /var/lib/remote-control-hub/setup-state.json
      TOTP_KEYRING_FILE: /var/lib/remote-control-hub/totp-keyring.json
      TRUSTED_PROXIES: '["172.16.0.0/12"]'
      TZ: Asia/Shanghai
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?WEBAUTHN_ORIGINS is required}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
      WEBAUTHN_RP_NAME: Remote Control Hub
      WEB_ROOT: /opt/remote-control-hub/web
    ports:
      - "127.0.0.1:51692:51692"
    volumes:
      - remote-control-hub-server-state:/var/lib/remote-control-hub
    networks:
      - remote-control-hub-network

  remote-control-hub-mysql:
    container_name: remote-control-hub-mysql
    image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: remote_control_hub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: remote_control_hub
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - remote-control-hub-mysql-data:/var/lib/mysql
    networks:
      - remote-control-hub-network

  remote-control-hub-redis:
    container_name: remote-control-hub-redis
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning --pass "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - remote-control-hub-redis-data:/data
    networks:
      - remote-control-hub-network

networks:
  remote-control-hub-network:
    name: remote-control-hub-network

volumes:
  remote-control-hub-mysql-data:
    name: remote-control-hub-mysql-data
  remote-control-hub-redis-data:
    name: remote-control-hub-redis-data
  remote-control-hub-server-state:
    name: remote-control-hub-server-state
